name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-tarpaulin
      # Plain `--workspace` again. It was scoped off cdno-tauri while the
      # desktop app still existed (#597): that tree was this job's entire
      # cost, since `-Clink-dead-code` plus full debug info over
      # webkit/objc/GTK both took ~14 minutes and filled the runner's
      # disk, which is why the job once reclaimed ~25 GB of preinstalled
      # toolchains and installed system libraries before it could run.
      # With the package gone the exclusions would name nothing, and
      # `--exclude` on an absent package is an error rather than a no-op.
      #
      # `--engine llvm`: the default ptrace engine plants breakpoints into the
      # running test binaries from the debug line tables, and a breakpoint at
      # a bad address segfaults the process on first execution of that code —
      # it did, deterministically, in `handlers_operations` once RFC 0005's
      # T16 changed an async handler's layout, while every native test
      # passed. The LLVM engine instruments at compile time instead, so code
      # layout cannot break it.
      - run: cargo tarpaulin --workspace --engine llvm --out xml
      - uses: codecov/codecov-action@v5
        with:
          files: cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
