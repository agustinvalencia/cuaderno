name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Dwarnings"
  # System libraries cdno-tauri needs to compile on Linux (webkit2gtk
  # pulls in soup/javascriptcore). Kept in one place; every job that
  # builds the workspace installs them.
  TAURI_LINUX_DEPS: >-
    libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev patchelf

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        run: |
          # The runner image ships third-party apt sources (Chrome) that
          # intermittently serve a Packages index whose hash disagrees with
          # the Release file they were published against. `apt-get update`
          # treats that as fatal, exits 100, and takes down every job that
          # needs these libraries before a line of Rust is compiled. None of
          # the packages below come from those sources, so drop them first.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y $TAURI_LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        run: |
          # The runner image ships third-party apt sources (Chrome) that
          # intermittently serve a Packages index whose hash disagrees with
          # the Release file they were published against. `apt-get update`
          # treats that as fatal, exits 100, and takes down every job that
          # needs these libraries before a line of Rust is compiled. None of
          # the packages below come from those sources, so drop them first.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y $TAURI_LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install Tauri system dependencies
        run: |
          # The runner image ships third-party apt sources (Chrome) that
          # intermittently serve a Packages index whose hash disagrees with
          # the Release file they were published against. `apt-get update`
          # treats that as fatal, exits 100, and takes down every job that
          # needs these libraries before a line of Rust is compiled. None of
          # the packages below come from those sources, so drop them first.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y $TAURI_LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  ui:
    name: UI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # tarpaulin builds every test binary with `-Clink-dead-code` and full
      # debug info, and the Tauri dependency tree is large enough that the
      # combination fills the runner's disk — rustc dies with `IO failure on
      # output stream: No space left on device` partway through `cdno-mcp`.
      # Reclaiming the preinstalled toolchains we do not use buys ~25 GB.
      - name: Free disk space for tarpaulin
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/.ghcup
          df -h / | tail -1
      - name: Install Tauri system dependencies
        run: |
          # The runner image ships third-party apt sources (Chrome) that
          # intermittently serve a Packages index whose hash disagrees with
          # the Release file they were published against. `apt-get update`
          # treats that as fatal, exits 100, and takes down every job that
          # needs these libraries before a line of Rust is compiled. None of
          # the packages below come from those sources, so drop them first.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/microsoft-prod.list
          sudo apt-get update
          sudo apt-get install -y $TAURI_LINUX_DEPS
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-tarpaulin
      - run: cargo tarpaulin --workspace --out xml
      - uses: codecov/codecov-action@v5
        with:
          files: cobertura.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}
