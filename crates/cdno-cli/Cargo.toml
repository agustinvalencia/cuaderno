[package]
name = "cdno-cli"
description = "Command-line interface for Cuaderno"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "cdno_cli"
path = "src/lib.rs"

[[bin]]
name = "cdno"
path = "src/main.rs"

[dependencies]
cdno-core.workspace = true
cdno-domain.workspace = true
clap.workspace = true
clap_complete.workspace = true
inquire.workspace = true
fuzzy-matcher.workspace = true
open.workspace = true
shlex.workspace = true
comfy-table.workspace = true
crossterm.workspace = true
textwrap.workspace = true
anstyle.workspace = true
colorchoice.workspace = true
anstyle-query.workspace = true
anyhow.workspace = true
chrono.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Tests measure display width with the same function the renderer
# uses; asserting on `chars().count()` instead would silently pass for
# CJK and emoji, which are the cases that matter.
textwrap.workspace = true
tempfile.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
serde_json.workspace = true
