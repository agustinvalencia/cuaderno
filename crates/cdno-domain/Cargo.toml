[package]
name = "cdno-domain"
description = "Domain logic for Cuaderno: note types, business rules, queries, state transitions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
cdno-core.workspace = true
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
chrono.workspace = true
# Parsing a candidate `.cuaderno/config.toml` for the read-only config
# inspector's dry-run validator (#365) — the same `toml::from_str`
# `VaultConfig::load` runs, composed here without touching disk.
toml.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true
tracing-subscriber.workspace = true
# Builds the SQLite "malformed" error a damaged index file returns, for
# the test index that fails like one (#526).
rusqlite.workspace = true
# Two stores over one folder with independent `flock`s, the two-kernel
# case of the vault write lock (#1012). Only a dev-dependency turns the
# feature on, so a production build never has the seams.
cdno-core = { workspace = true, features = ["test-support"] }
