[package]
name = "cdno-core"
description = "Core library for Cuaderno: file I/O, markdown parsing, SQLite indexing, file watching"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde.workspace = true
serde_yaml.workspace = true
serde_json.workspace = true
toml.workspace = true
toml_edit.workspace = true
thiserror.workspace = true
chrono.workspace = true
pulldown-cmark.workspace = true
globset.workspace = true
rusqlite.workspace = true
xxhash-rust.workspace = true
typst-syntax.workspace = true
# Runtime dependency since GH #303: FsVaultStore materialises every
# content write in a NamedTempFile in the target's directory and
# renames it over the destination — atomic, crash-safe writes.
tempfile.workspace = true
# Filesystem watching (FileWatcher trait + FsFileWatcher). See the
# workspace manifest for the rationale.
notify.workspace = true
notify-debouncer-mini.workspace = true
# A release-build trace where a domain verb breaks the read-inside-the-
# transaction rule a debug build asserts (#1001).
tracing.workspace = true

# Process-group kill for a timed-out git (git.rs).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rusqlite.workspace = true
proptest.workspace = true
# The crate's own integration tests enable its test seams (#1001). Only a
# dev-dependency turns the feature on, so a production build never has them.
cdno-core = { path = ".", features = ["test-support"] }

[features]
# Test seams on `FsVaultStore` (an independent lock file, hooks inside the
# conditional write). Never enabled by a production crate.
test-support = []
